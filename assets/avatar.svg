<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#FF6EC7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24283B"/>
      <stop offset="100%" stop-color="#16161E"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="clip"><circle cx="140" cy="140" r="104"/></clipPath>
  </defs>

  <!-- pulsing glow -->
  <circle cx="140" cy="140" r="118" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- solid gradient ring -->
  <circle cx="140" cy="140" r="116" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- dashed ring spinning the other way -->
  <circle cx="140" cy="140" r="128" fill="none" stroke="#6C63FF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="360 140 140" to="0 140 140" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- portrait -->
  <circle cx="140" cy="140" r="106" fill="url(#bg)"/>
  <text x="140" y="158" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="78" font-weight="700" fill="url(#mono)">SG</text>
  <text x="140" y="196" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="18" fill="#7AA2F7">&lt;/&gt;
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- orbiting dots -->
  <g>
    <circle cx="140" cy="12" r="6" fill="#00D4FF"/>
    <circle cx="268" cy="140" r="4" fill="#FF6EC7"/>
    <circle cx="140" cy="268" r="5" fill="#A78BFA"/>
    <animateTransform attributeName="transform" type="rotate" from="0 140 140" to="360 140 140" dur="9s" repeatCount="indefinite"/>
  </g>
</svg>
